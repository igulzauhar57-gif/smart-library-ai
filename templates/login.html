<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMART LIBRARY AI — Кіру</title><style>body{font-family:system-ui,Arial;background:linear-gradient(130deg,#11234d,#3564be);min-height:100vh;margin:0;display:grid;place-items:center;color:#213456}.card{background:white;border-radius:22px;padding:32px;width:min(88vw,420px);box-shadow:0 20px 65px #07172c66}h1{font-size:27px}label{display:block;margin-top:18px;font-weight:600}input{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #aebed6;border-radius:10px;font:inherit}button{width:100%;background:#2457c7;color:white;padding:14px;border:0;border-radius:10px;font:inherit;margin-top:22px}.error{color:#a32424}.note{font-size:14px;color:#667}</style></head><body><main class="card"><h1>📚 SMART LIBRARY AI</h1><p>М. Әбенова атындағы ЖББМ</p><h2>Кітапханашының жеке кабинеті</h2>{% if not has_users %}<p class="error">Әкімші әлі орнатылмаған. Нұсқаулықтағы бірінші қадамды орындаңыз.</p>{% endif %}{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Логин<input name="username" autocomplete="username" required></label><label>Құпиясөз<input type="password" name="password" autocomplete="current-password" required></label><button>Кіру</button></form><p class="note">Бұл жүйеге тек рұқсат етілген кітапханашы кіре алады.</p></main></body></html>
